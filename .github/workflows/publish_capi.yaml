name: Publish CAPI Libraries

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.5.7-capi.1)'
        required: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            src_lib: df.dll
            lib: deep_filter_lib.dll
            zip: deep_filter_lib-x86_64-windows.zip
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            src_lib: libdf.so
            lib: libdeep_filter_lib.so
            zip: libdeep_filter_lib-x86_64-linux.zip
          - os: macos-14
            target: aarch64-apple-darwin
            src_lib: libdf.dylib
            lib: libdeep_filter_lib.dylib
            zip: libdeep_filter_lib-arm64-macos.zip
          - os: ubuntu-22.04
            target: aarch64-linux-android
            ndk_arch: aarch64-linux-android26
            src_lib: libdf.so
            lib: libdeep_filter_lib-arm64-android.so
            zip: libdeep_filter_lib-arm64-android.zip
          - os: ubuntu-22.04
            target: armv7-linux-androideabi
            ndk_arch: armv7a-linux-androideabi26
            src_lib: libdf.so
            lib: libdeep_filter_lib-arm-android.so
            zip: libdeep_filter_lib-arm-android.zip
          - os: ubuntu-22.04
            target: x86_64-linux-android
            ndk_arch: x86_64-linux-android26
            src_lib: libdf.so
            lib: libdeep_filter_lib-x86_64-android.so
            zip: libdeep_filter_lib-x86_64-android.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Android NDK and configure linker
        if: ${{ contains(matrix.target, 'android') }}
        run: |
          curl -fsSL https://dl.google.com/android/repository/android-ndk-r28-linux.zip -o /tmp/ndk-r28.zip
          unzip -q /tmp/ndk-r28.zip -d /tmp/
          NDK_HOME=$(ls -d /tmp/android-ndk-*/ | head -1)
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> $GITHUB_ENV
          echo "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
          mkdir -p .cargo
          cat > .cargo/config.toml << EOF
          [target.${{ matrix.target }}]
          linker = "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.ndk_arch }}-clang"
          EOF
      - name: Create NDK compiler symlinks for tract-linalg cc crate
        if: ${{ contains(matrix.target, 'android') }}
        run: |
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          case "${{ matrix.ndk_arch }}" in
            armv7a-*)
              ln -sf "$NDK_BIN/${{ matrix.ndk_arch }}-clang"    "$NDK_BIN/arm-linux-androideabi-clang"
              ln -sf "$NDK_BIN/${{ matrix.ndk_arch }}-clang++"  "$NDK_BIN/arm-linux-androideabi-clang++"
              ;;
            aarch64-*)
              ln -sf "$NDK_BIN/${{ matrix.ndk_arch }}-clang"    "$NDK_BIN/aarch64-linux-android-clang"
              ln -sf "$NDK_BIN/${{ matrix.ndk_arch }}-clang++"  "$NDK_BIN/aarch64-linux-android-clang++"
              ;;
            x86_64-*)
              ln -sf "$NDK_BIN/${{ matrix.ndk_arch }}-clang"    "$NDK_BIN/x86_64-linux-android-clang"
              ln -sf "$NDK_BIN/${{ matrix.ndk_arch }}-clang++"  "$NDK_BIN/x86_64-linux-android-clang++"
              ;;
          esac
      - run: cargo build --release -p deep_filter --features capi --target ${{ matrix.target }}
      - run: mkdir staging && cp target/${{ matrix.target }}/release/${{ matrix.src_lib }} staging/${{ matrix.lib }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip }}
          path: staging/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: zips
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          files: zips/**/*
          update: true
          draft: false
          prerelease: true
