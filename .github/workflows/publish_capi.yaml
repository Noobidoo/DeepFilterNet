name: Publish CAPI Libraries

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.5.7-capi.1)'
        required: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            src_lib: df.dll
            lib: deep_filter_lib.dll
            zip: deep_filter_lib-x86_64-windows.zip
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            src_lib: libdf.so
            lib: libdeep_filter_lib.so
            zip: libdeep_filter_lib-x86_64-linux.zip
          - os: macos-14
            target: aarch64-apple-darwin
            src_lib: libdf.dylib
            lib: libdeep_filter_lib.dylib
            zip: libdeep_filter_lib-arm64-macos.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release -p deep_filter --features capi --target ${{ matrix.target }}
      - run: mkdir staging && cp target/${{ matrix.target }}/release/${{ matrix.src_lib }} staging/${{ matrix.lib }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip }}
          path: staging/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: zips
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          files: zips/**/*
          draft: false
          prerelease: true
